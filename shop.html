<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tour Pro Shop | Player Collections</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f7f8f4; color: #15201b; }
      img { display: block; max-width: 100%; }
      a { color: inherit; text-decoration: none; }
      .site-header { position: sticky; top: 0; z-index: 30; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 72px; padding: 10px clamp(18px, 4vw, 42px); border-bottom: 1px solid rgba(21, 96, 0, 0.18); background: #f7f1e5; color: #156000; box-shadow: 0 8px 20px rgba(21, 96, 0, 0.08); }
      .header-logo { grid-column: 2; grid-row: 1; display: inline-flex; align-items: center; justify-content: center; width: 142px; }
      .header-logo img { width: 142px; height: 54px; object-fit: contain; }
      .header-cart { grid-column: 3; grid-row: 1; justify-self: end; color: #15201b; font: 900 0.86rem/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
      .nav-toggle { grid-column: 1; grid-row: 1; display: inline-grid; gap: 7px; justify-self: start; width: 44px; height: 38px; padding: 6px 0; border: 0; background: transparent; cursor: pointer; }
      .nav-toggle span { display: block; width: 40px; height: 2px; background: #15201b; }
      .site-nav { position: absolute; top: 100%; left: 0; display: none; width: min(360px, 100vw); padding: 18px clamp(18px, 4vw, 42px) 24px; background: #f7f1e5; box-shadow: 0 20px 34px rgba(21, 96, 0, 0.12); }
      .site-nav.is-open { display: grid; }
      .site-nav a { display: block; padding: 14px 0; border-bottom: 1px solid rgba(21, 96, 0, 0.12); color: #156000; font: 900 0.9rem/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
      .carousel-page { width: 100%; max-width: none; padding: 0; }
      .hero-carousel, .carousel-track, .carousel-slide { min-height: calc(100vh - 72px); }
      .hero-carousel { position: relative; overflow: hidden; background: #e8e1d2; }
      .carousel-track { display: flex; transition: transform 850ms cubic-bezier(0.77, 0, 0.175, 1); }
      .carousel-slide { position: relative; display: grid; flex: 0 0 100%; color: white; isolation: isolate; }
      .slide-art { position: absolute; inset: 0; z-index: -2; display: grid; grid-template-columns: 1fr 1fr; background: #e6decf; }
      .slide-art img { width: 100%; height: 100%; min-height: calc(100vh - 72px); object-fit: cover; }
      .slide-copy { align-self: end; width: min(760px, calc(100% - 40px)); padding: 0 0 clamp(70px, 9vw, 120px) clamp(20px, 5vw, 72px); }
    </style>
  </head>
  <body>
    <header class="site-header">
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav-links" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <a class="header-logo" href="/shop.html" aria-label="Tour Pro Shop home">
        <img src="/assets/images/tour-pro-shop-logo.svg" alt="Tour Pro Shop" />
      </a>
      <a class="header-cart" href="/cart.html">Cart</a>
      <nav class="site-nav" id="site-nav-links" aria-label="Main navigation">
        <div class="nav-left">
          <a href="/players.html">Players</a>
          <a href="/collections.html">Collections</a>
        </div>
        <div class="nav-right">
          <a href="/about.html">About Us</a>
          <a href="/account.html">Account</a>
          <a href="/cart.html">Cart</a>
        </div>
      </nav>
    </header>

    <main class="carousel-page">
      <section class="hero-carousel" aria-label="Featured Tour Pro Shop releases">
        <button class="carousel-control carousel-prev" type="button" aria-label="Previous slide">‹</button>
        <div class="carousel-track" id="carousel-track"></div>
        <button class="carousel-control carousel-next" type="button" aria-label="Next slide">›</button>
        <div class="carousel-dots" id="carousel-dots" aria-label="Carousel slides"></div>
      </section>
    </main>

    <script src="/assets/nav.js"></script>
    <script src="/assets/catalog.js"></script>
    <script src="/assets/shop.js"></script>
  </body>
</html>
