<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tour Pro Shop</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Georgia, 'Times New Roman', serif;
    }

    body {
      height: 100vh;
      background: url('sawgrass.jpg') center / cover no-repeat;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    .topbar {
      height: 80px;
      background: rgba(236, 231, 223, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      letter-spacing: 1px;
    }

    /* Center panel */
    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel {
      background: rgba(236, 231, 223, 0.92);
      padding: 40px 60px;
      border-radius: 16px;
      text-align: center;
      width: 400px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 25px;
      color: #4a5568;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    input:focus {
      border-color: #888;
    }
  </style>
</head>

<body>

  <div class="topbar">
    Tour Pro Shop
  </div>

  <div class="container">
    <div class="panel">
      <h1>Restricted Access</h1>
      <input 
        type="password" 
        placeholder="Enter password" 
        id="password"
        onkeypress="checkPassword(event)"
      />
    </div>
  </div>

  <script>
    const PASSWORD = "golf123"; // change this
    const REDIRECT = "https://google.com"; // change this

    function checkPassword(e) {
      if (e.key === "Enter") {
        const val = document.getElementById("password").value;
        if (val === PASSWORD) {
          window.location.href = REDIRECT;
        } else {
          alert("Incorrect password");
        }
      }
    }
  </script>

</body>
</html>
