<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tour Pro Shop | Player</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav-links" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <a class="header-logo" href="/shop.html" aria-label="Tour Pro Shop home">
        <img src="/assets/images/tour-pro-shop-logo.svg" alt="Tour Pro Shop" />
      </a>
      <a class="header-cart" href="/cart.html">Cart</a>
      <nav class="site-nav" id="site-nav-links" aria-label="Main navigation">
        <div class="nav-left">
          <a href="/players.html">Players</a>
          <a href="/collections.html">Collections</a>
        </div>
        <div class="nav-right">
          <a href="/about.html">About Us</a>
          <a href="/account.html">Account</a>
          <a href="/cart.html">Cart</a>
        </div>
      </nav>
    </header>

    <main class="player-detail-page" id="player-detail"></main>

    <dialog class="interest-modal" id="interest-modal">
      <form class="interest-form" id="interest-form" novalidate>
        <button class="modal-close" type="button" aria-label="Close">×</button>
        <p class="eyebrow">Request Gear</p>
        <h2 id="modal-title">Let them know I want their gear</h2>
        <label>
          Name
          <input name="name" type="text" autocomplete="name" required />
        </label>
        <label>
          Email
          <input name="email" type="email" autocomplete="email" />
        </label>
        <label>
          Mobile number
          <input name="mobile" type="tel" autocomplete="tel" inputmode="tel" />
        </label>
        <p class="form-message" id="interest-message" role="status" aria-live="polite"></p>
        <button class="cart-button" type="submit">Submit request</button>
      </form>
    </dialog>

    <script src="/assets/nav.js"></script>
    <script src="/assets/player.js"></script>
  </body>
</html>
